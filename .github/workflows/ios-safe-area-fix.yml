name: Apply iPhone safe-area fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-safe-area-fix.yml'

permissions:
  contents: write

jobs:
  patch-safe-area:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile safe-area spacing
        shell: python
        run: |
          from pathlib import Path

          path = Path('styles.css')
          css = path.read_text(encoding='utf-8')

          old_topbar = '''.topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
          '''
          new_topbar = '''.topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(12px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 12px max(18px, env(safe-area-inset-left));
          '''

          if old_topbar not in css:
              raise SystemExit('Topbar block not found; styles.css was not changed.')
          css = css.replace(old_topbar, new_topbar, 1)

          old_editbar = '''.edit-bar {
            display: none;
            position: sticky;
            top: 66px;
          '''
          new_editbar = '''.edit-bar {
            display: none;
            position: sticky;
            top: calc(66px + env(safe-area-inset-top));
          '''
          if old_editbar not in css:
              raise SystemExit('Edit-bar block not found; styles.css was not changed.')
          css = css.replace(old_editbar, new_editbar, 1)

          path.write_text(css, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: respect iPhone safe area in top navigation"
          git push
